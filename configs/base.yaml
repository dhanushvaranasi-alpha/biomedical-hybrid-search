# Base retrieval config. Named configs override individual keys.
name: base
mode: hybrid            # lexical | dense | hybrid
k_retrieve: 50
embedding:
  model: BAAI/bge-small-en-v1.5
  max_tokens: 256
  overlap: 32
expansion:
  enabled: false
  n: 3
  orig_weight: 1.0
  alt_weight: 0.5
fusion:
  method: rrf           # rrf | weighted
  k_rrf: 60
  alpha: 0.5            # weight on dense when method=weighted
rerank:
  enabled: false
  model: BAAI/bge-reranker-base
  top_n: 30
context:
  top_c: 5
  token_budget: 3000
